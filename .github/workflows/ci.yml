name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant voluptuous

      - name: Validate manifest and translations
        run: |
          python -c "import json; json.load(open('custom_components/home_project_ledger/manifest.json'))"
          python -c "import json; json.load(open('custom_components/home_project_ledger/strings.json'))"
          python -c "import json; json.load(open('custom_components/home_project_ledger/translations/en.json'))"
          python -c "import json; json.load(open('custom_components/home_project_ledger/translations/sv.json'))"

      - name: Check Python syntax
        run: python -m compileall -q custom_components/home_project_ledger